<svg xmlns="http://www.w3.org/2000/svg" width="860" height="365" viewBox="0 0 860 365" role="img" aria-labelledby="t">
  <title id="t">Expression tree for 1 plus f of 2 times 3 with evaluation order badges</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="20" y="22" fill="#8a6d3b" font-size="12" font-weight="600" text-anchor="start">evaluating: 1 + f(2) * 3</text>

    <g fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5">
      <rect x="385" y="30" width="70" height="56" rx="8"/>
      <rect x="190" y="140" width="70" height="56" rx="8"/>
      <rect x="560" y="140" width="70" height="56" rx="8"/>
      <rect x="500" y="250" width="90" height="56" rx="8"/>
      <rect x="655" y="250" width="70" height="56" rx="8"/>
    </g>
    <g fill="#1a1a2e" font-size="17" font-weight="600">
      <text x="420" y="65">+</text>
      <text x="225" y="175">1</text>
      <text x="595" y="175">*</text>
      <text x="545" y="285">f(2)</text>
      <text x="690" y="285">3</text>
    </g>

    <g stroke="#1a1a2e" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <path d="M405 86 L245 136"/>
      <path d="M435 86 L575 136"/>
      <path d="M588 196 L552 246"/>
      <path d="M605 196 L678 246"/>
    </g>

    <g fill="#e8a13a">
      <circle cx="385" cy="30" r="13"/>
      <circle cx="190" cy="140" r="13"/>
      <circle cx="560" cy="196" r="13"/>
      <circle cx="500" cy="250" r="13"/>
      <circle cx="655" cy="250" r="13"/>
    </g>
    <g fill="#1a1a2e" font-size="12.5" font-weight="700">
      <text x="385" y="34.5">5</text>
      <text x="190" y="144.5">1</text>
      <text x="560" y="200.5">4</text>
      <text x="500" y="254.5">2</text>
      <text x="655" y="254.5">3</text>
    </g>

    <text x="430" y="335" fill="#555" font-size="11.5">Children evaluate first (badges 1-3), then each operator consumes the results bottom-up (4-5).</text>
    <text x="430" y="353" fill="#555" font-size="11.5">The order is observable only when evaluation can have side effects.</text>
  </g>
</svg>
